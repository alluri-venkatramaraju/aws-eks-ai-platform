apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: { name: default }
spec:
  amiSelectorTerms: [{ alias: al2023@latest }]
  role: eks-ai-platform-dev-karpenter-node
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: eks-ai-platform-dev } }]
  securityGroupSelectorTerms: [{ tags: { karpenter.sh/discovery: eks-ai-platform-dev } }]
  metadataOptions: { httpEndpoint: enabled, httpProtocolIPv6: disabled, httpPutResponseHopLimit: 1, httpTokens: required }
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: { volumeSize: 100Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true }
  tags: { ManagedBy: karpenter, Project: eks-ai-platform }
