apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: cpu-on-demand }
spec:
  template:
    metadata: { labels: { workload-class: cpu } }
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["4"] }
  limits: { cpu: "100", memory: 400Gi }
  disruption: { consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 5m }
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: cpu-spot }
spec:
  template:
    metadata: { labels: { workload-class: cpu, capacity: spot } }
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
  limits: { cpu: "200", memory: 800Gi }
  disruption: { consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 2m }
