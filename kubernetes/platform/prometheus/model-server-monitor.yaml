apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: model-server, namespace: ai-platform }
spec:
  namespaceSelector: { matchNames: [model-serving] }
  selector: { matchLabels: { app.kubernetes.io/name: model-server } }
  endpoints: [{ port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }]
