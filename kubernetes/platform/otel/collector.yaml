apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector, namespace: ai-platform }
automountServiceAccountToken: false
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata: { name: otel, namespace: ai-platform }
spec:
  mode: deployment
  replicas: 2
  serviceAccount: otel-collector
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
  config:
    receivers: { otlp: { protocols: { grpc: { endpoint: "0.0.0.0:4317" }, http: { endpoint: "0.0.0.0:4318" } } } }
    processors: { memory_limiter: { check_interval: 1s, limit_mib: 400 }, batch: {} }
    exporters: { debug: { verbosity: basic }, prometheus: { endpoint: "0.0.0.0:8889" } }
    service: { pipelines: { traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }, metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] } } }
