apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-trainer
  namespace: batch-training
automountServiceAccountToken: false
---
# This inexpensive CPU job demonstrates scheduling and resource controls without
# downloading a model or requiring a GPU.
apiVersion: batch/v1
kind: Job
metadata:
  name: example-training
  namespace: batch-training
  labels:
    app.kubernetes.io/name: example-training
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-training
    spec:
      serviceAccountName: batch-trainer
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-class: cpu
      containers:
        - name: training
          image: python:3.12-slim-bookworm@sha256:a116514e19457bcb7af7efe9c3dd0b9b71e85b317694e7882a1c52aa15a78134
          imagePullPolicy: Always
          command:
            - python
            - -c
          args:
            - >-
              import json,time;
              print(json.dumps({'service':'batch-training','event':'started'}));
              time.sleep(10);
              print(json.dumps({'service':'batch-training','event':'completed'}))
          env:
            - name: OTEL_SERVICE_NAME
              value: batch-training
            - name: ENVIRONMENT
              value: dev
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
