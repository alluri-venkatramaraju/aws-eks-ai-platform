apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: model-serving
  labels:
    app.kubernetes.io/name: model-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-server
  namespace: model-serving
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-server
  namespace: model-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-server
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
