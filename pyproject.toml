[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eks-ai-platform-model-server"
version = "0.2.0"
description = "Observable example inference API for an AWS EKS AI platform"
requires-python = ">=3.11"
dependencies = ["opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
