apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes/base
  - ../../kubernetes/platform/karpenter
  - ../../kubernetes/platform/otel
  - ../../kubernetes/platform/external-secrets
  - ../../kubernetes/platform/prometheus
  - ../../kubernetes/platform/grafana
  - ../../kubernetes/workloads/model-serving
images:
  - name: model-server
    newName: ghcr.io/venkatramarajualluri/model-server
    newTag: v0.2.0
replicas:
  - name: model-server
    count: 3
patches:
  - target:
      kind: EC2NodeClass
      name: default
    patch: |-
      - op: replace
        path: /spec/role
        value: eks-ai-platform-prod-karpenter-node
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: eks-ai-platform-prod
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: eks-ai-platform-prod
  - target:
      kind: Deployment
      name: model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
