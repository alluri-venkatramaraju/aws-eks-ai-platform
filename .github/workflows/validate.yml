name: Validate
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "validate-${{ github.ref }}", cancel-in-progress: true }
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: pytest -q
  terraform:
    runs-on: ubuntu-latest
    strategy: { matrix: { environment: [dev, stage, prod] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.15.8 }
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/environments/${{ matrix.environment }} init -backend=false
      - run: terraform -chdir=terraform/environments/${{ matrix.environment }} validate
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with: { version: v1.35.0 }
      - run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz' | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - run: for environment in dev stage prod; do kubectl kustomize gitops/$environment | kubeconform -strict -summary -ignore-missing-schemas; done
