name: Security
on:
  pull_request:
  schedule: [{ cron: "17 5 * * 1" }]
permissions: { contents: read, security-events: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with: { directory: ., framework: terraform,kubernetes,dockerfile,github_actions }
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with: { scan-type: config, scan-ref: ., format: sarif, output: trivy.sarif, severity: HIGH,CRITICAL, exit-code: "1" }
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with: { sarif_file: trivy.sarif }
