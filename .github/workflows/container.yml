name: Container
on: { push: { branches: [main], tags: ["v*"] } }
permissions: { contents: read, packages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and smoke test
        run: |
          docker build --tag model-server:test .
          container_id=$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:8080:8080 model-server:test)
          trap 'docker rm --force "${container_id}"' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs "${container_id}"
          exit 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: publish
        with:
          context: .
          push: true
          tags: |
            ghcr.io/venkatramarajualluri/model-server:${{ github.sha }}
            ghcr.io/venkatramarajualluri/model-server:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Sign published image
        env:
          IMAGE_DIGEST: "${{ steps.publish.outputs.digest }}"
        run: cosign sign --yes "ghcr.io/venkatramarajualluri/model-server@${IMAGE_DIGEST}"
